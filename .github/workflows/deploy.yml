name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter 3.10.7 (manual)
        run: |
          set -euo pipefail
          FLUTTER_VERSION=3.10.7
          URL="https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          echo "Downloading Flutter ${FLUTTER_VERSION} from ${URL}"
          rm -rf $HOME/flutter
          mkdir -p $HOME/flutter
          curl -sSfL "${URL}" -o flutter.tar.xz
          tar xf flutter.tar.xz -C $HOME/flutter
          echo "$HOME/flutter/flutter/bin" >> $GITHUB_PATH
          flutter --version
          flutter config --enable-web
          flutter precache --web

      - name: Verify Flutter / Dart versions
        run: |
          flutter --version
          dart --version || true
          echo "Check Flutter releases JSON (first 200 bytes)"
          curl -s https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json | head -c 200 || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web (release)
        run: flutter build web --release --base-href /devfolio/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
